# Managed by Run It bootstrap.
# HTTP is challenge-only: credentials and API traffic are never served in plaintext.
server {
    listen 80;
    listen [::]:80;
    server_name @@ORIGIN_HOST@@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 503 "TLS certificate required\n";
    }
}
