x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2358/about || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data_v2:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - redis_data:/data/
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

volumes:
  data_v2:
  redis_data:
