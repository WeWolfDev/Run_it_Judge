# Run It reverse proxy for a local Tailscale Funnel endpoint.
# Tailscale terminates public HTTPS and forwards to 127.0.0.1:8080.
# This listener must never be exposed directly on a public interface.

map $http_upgrade $runit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $runit_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Kept for compatibility with clients that use the /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
    }

    location ~ ^/(health|ready|auth|problems|tournaments|access-codes|rounds|public)(/|$) {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_read_timeout 60s;
    }
}
