<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages no deja poner cabeceras: la política va aquí. Solo admite
      código del sitio y de jsDelivr (Clang y Pyodide en versiones fijas).
      Monaco y KaTeX meten estilos en línea: por eso style-src 'unsafe-inline'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Run It Solo</title>
    <meta
      name="description"
      content="Practica programación competitiva contra el reloj. El código se corrige en tu navegador."
    />
    <meta property="og:title" content="Run It Solo" />
    <meta property="og:description" content="Practica contra el reloj, sin cuenta." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/solo-main.tsx"></script>
  </body>
</html>
