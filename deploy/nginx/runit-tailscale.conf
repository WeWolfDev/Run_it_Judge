# Run It reverse proxy for a local Tailscale Funnel endpoint.
# Tailscale terminates public HTTPS and forwards to 127.0.0.1:8080.
# This listener must never be exposed directly on a public interface.

map $http_upgrade $runit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Problems travel as one JSON body: a real .zip of test cases (statement plus
    # up to 100 stdin/expected pairs) is several MB, and 1m rejected it with a 413
    # HTML page the admin could not act on. Must stay in sync with MAX_BODY_BYTES
    # in run-it-backend/index.js, or one layer answers 413 while the other does not.
    client_max_body_size 16m;

    # Serve the login page directly at the public root. This avoids relying on
    # a browser or embedded webview following the 307 from the SSR app.
    location = / {
        proxy_pass http://127.0.0.1:3002/login;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $runit_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Kept for compatibility with clients that use the /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
    }

    location ~ ^/(health|ready|auth|problems|tournaments|access-codes|rounds|public)(/|$) {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_read_timeout 60s;
    }
}
