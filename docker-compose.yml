x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    # El techo real de Judge0 no son los workers sino estas peticiones: por cada
    # envio en vuelo hay un POST de alta y un GET de consulta cada 500 ms. Con los
    # defaults de la imagen (16 threads x 2 procesos = 32) se agotaba el pool de
    # ActiveRecord y la API devolvia 500 con 16 envios en vuelo, de forma
    # intermitente. Subir los threads duplica el margen.
    #
    # El pool de conexiones sigue a RAILS_MAX_THREADS, asi que 32 x 2 = 64
    # conexiones: cabe en los max_connections=100 de la base de Judge0.
    environment:
      RAILS_MAX_THREADS: "32"
      RAILS_SERVER_PROCESSES: "2"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2358/about || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    command: ["./scripts/workers"]
    # Un worker ejecuta COUNT=8 (judge0.conf) a la vez. Con 50 participantes y
    # problemas de 20 casos hacen falta ~16 ejecuciones simultaneas, asi que un
    # solo worker se queda corto. Este replicado solo tiene sentido junto al
    # aumento de threads del server: workers sin capacidad de API no alcanzan.
    deploy:
      replicas: 2
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data_v2:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - redis_data:/data/
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: always

volumes:
  data_v2:
  redis_data:
